// dte:A3
// Internal harness (never published): opens a copy of testworlds/bubba-test-world in a real client with every
// repo mod loaded and screenshots the hub and each station. specs/testworld.md, "Screenshots".
//   ./gradlew :testworldshots:runClientGameTest -PmilestoneTests   -> build/run/clientGameTest/screenshots/
plugins {
	id 'net.fabricmc.fabric-loom'
}
apply from: rootProject.file('gradle/fabric-mod.gradle')
// Reworked Mobs requires Stormie's Spiders (loaded as a mod by this script).
apply from: rootProject.file('gradle/stormies-spiders.gradle')

// The mods under test, as their built jars on the game's classpath (Fabric Loader finds a fabric.mod.json in
// each jar and loads it as a mod, the same as in a Modrinth profile). Gradle builds the jars first.
def modsUnderTest = ['bubbas_reworked_mobs', 'bubbas_extra_recipes', 'bubbas_infused_gems', 'bubbas_reworked_beacons', 'bubbas_totems_artifacts', 'bubbas_reworked_mining']
// Configure those projects first so their jar tasks exist whichever project Gradle configures first.
modsUnderTest.each { evaluationDependsOn(":${it}") }
def modJars = files(modsUnderTest.collect { m -> rootProject.project(":${m}").tasks.named('jar').flatMap { it.archiveFile } })
// The game reads the jars from a private copy: another agent rebuilding a mod mid-run rewrites its jar in place, and
// the running game then fails to load classes from it ("invalid LOC header").
def snapshotDir = layout.buildDirectory.dir('modsUnderTest')
def snapshotJars = tasks.register('snapshotModJars', Sync) {
	from modJars
	into snapshotDir
}
dependencies {
	runtimeOnly files(snapshotDir.map { d -> d.asFileTree }) {
		builtBy snapshotJars
	}
}

def testWorld = rootProject.file('testworlds/bubba-test-world')
tasks.matching { it.name == 'runClientGameTest' }.configureEach { t ->
	t.jvmArgs("-Dbubba.testworld=${testWorld.absolutePath}")
	t.inputs.dir(testWorld).withPropertyName('testWorld')
}
// No server game tests here; don't boot a server for nothing during `build`.
tasks.matching { it.name == 'runGameTest' }.configureEach { enabled = false }
