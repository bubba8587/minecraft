plugins {
	id 'net.fabricmc.fabric-loom'
}
apply from: rootProject.file('gradle/fabric-mod.gradle')

// No dependency on Bubba's Totems & Artifacts in either direction at build time: it reaches sleepers through this
// mod's api/Sleepers (specs/totems-artifacts.md, "Independence"), and this mod never touches it.
dependencies {
	// Extra mod dependencies go here; see docs/knowledge/libraries.md.
}

// Datagen: `./gradlew :bubbas_reworked_mobs:runDatagen` writes src/main/generated (committed, added to main resources).
// client = true because the model provider uses client classes; the datagen entrypoint lives in src/client.
fabricApi {
	configureDataGeneration {
		client = true
	}
}
