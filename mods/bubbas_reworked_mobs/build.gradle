plugins {
	id 'net.fabricmc.fabric-loom'
}
apply from: rootProject.file('gradle/fabric-mod.gradle')
apply from: rootProject.file('gradle/stormies-spiders.gradle')

// No dependency on Bubba's Totems & Artifacts in either direction at build time: it reaches sleepers through this
// mod's api/Sleepers (specs/totems-artifacts.md, "Independence"), and this mod never touches it.
// Optional link to Bubba's Reworked Beacons (like Totems & Artifacts): compiled against it only; its payload
// entrypoint loads compat/FabricatorBeaconPayload when it's installed (specs/mob-factory.md, debuffs).
// -PwithBeacons also puts its jar on the game's classpath, so a Fabricator's paired beacons hang upside down, show
// their beam and run the heart in the `factories` client test and the game tests.
evaluationDependsOn(':bubbas_reworked_beacons')
def beaconsJar = files(rootProject.project(':bubbas_reworked_beacons').tasks.named('jar').flatMap { it.archiveFile })
dependencies {
	// Extra mod dependencies go here; see docs/knowledge/libraries.md.
	// Stormie's Spiders (required; gradle/stormies-spiders.gradle): compiled against here, loaded in dev runs by that
	// script. The nest spider opts out of its climbing while it's ours (spider/NestSpider).
	compileOnly stormiesSpidersCoords
	compileOnly project(':bubbas_reworked_beacons')
	gametestCompileOnly project(':bubbas_reworked_beacons')
	if (providers.gradleProperty('withBeacons').isPresent()) {
		runtimeOnly beaconsJar
	}
}

// Datagen: `./gradlew :bubbas_reworked_mobs:runDatagen` writes src/main/generated (committed, added to main resources).
// client = true because the model provider uses client classes; the datagen entrypoint lives in src/client.
fabricApi {
	configureDataGeneration {
		client = true
	}
}

