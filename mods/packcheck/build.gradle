// dte:A4
// Internal test harness (never published): every datapack under datapacks/ is bundled into this mod's
// resources and registered as an always-enabled built-in data pack, so the game tests in src/gametest/
// run against the real packs. See specs/pack-testing.md.
plugins {
	id 'net.fabricmc.fabric-loom'
}
apply from: rootProject.file('gradle/fabric-mod.gradle')

dependencies {
}

// datapacks/<name>/ -> build/generated/packcheck/datapacks/<name>/ -> jar path datapacks/<name>/.
// Packs with a DISABLED file (B10 alwaysLatest) are left out. Packcheck.onInitialize registers each folder.
def datapacksRoot = rootProject.file('datapacks')
def bundledPacks = (datapacksRoot.listFiles() ?: [] as File[])
	.findAll { it.isDirectory() && new File(it, 'pack.mcmeta').exists() && !new File(it, 'DISABLED').exists() }
	.sort { it.name }

def bundleDatapacks = tasks.register('bundleDatapacks', Sync) {
	description = 'Copies every enabled datapack in datapacks/ into packcheck\'s resources as a built-in pack.'
	inputs.property 'packs', bundledPacks*.name
	into layout.buildDirectory.dir('generated/packcheck')
	bundledPacks.each { pack ->
		from(pack) {
			into "datapacks/${pack.name}"
			exclude 'VERSION', 'packtest.commands', 'DISABLED'
		}
	}
}
sourceSets.main.resources.srcDir(bundleDatapacks)

// resourcepacks/<name>/ -> jar path resourcepacks/<name>/, registered as always-enabled built-in resource packs
// so client game tests render with them. Combined packs (a COMBINE file, e.g. bubbas_32x) have no assets of their own
// and are left out.
def resourcepacksRoot = rootProject.file('resourcepacks')
def bundledResourcePacks = (resourcepacksRoot.listFiles() ?: [] as File[])
	.findAll { it.isDirectory() && new File(it, 'pack.mcmeta').exists() && !new File(it, 'DISABLED').exists() && !new File(it, 'COMBINE').exists() }
	.sort { it.name }
def bundleResourcePacks = tasks.register('bundleResourcePacks', Sync) {
	description = 'Copies every enabled resource pack in resourcepacks/ into packcheck\'s resources as a built-in pack.'
	inputs.property 'packs', bundledResourcePacks*.name
	into layout.buildDirectory.dir('generated/packcheck-rp')
	bundledResourcePacks.each { pack ->
		from(pack) {
			into "resourcepacks/${pack.name}"
			exclude 'VERSION', 'DISABLED'
		}
	}
}
sourceSets.main.resources.srcDir(bundleResourcePacks)
