org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
# Speed: skip re-configuring every mod on each run (14s -> 2s for a no-op compile, measured 2026-11-14).
org.gradle.configuration-cache=true

# Toolchain defaults shared by every mod. A mod can override any of these in its own gradle.properties.
# Check current values at https://fabricmc.net/develop
loom_version=1.19.4
minecraft_version=26.4-pre-1
# fabric.mod.json range: Fabric reads snapshots as 26.4-pre.1, so "~26.4-pre-1" never matches; "~26.4-" takes any 26.4 pre-release and 26.4.x
minecraft_dependency=~26.4-
loader_version=0.20.1
fabric_api_version=0.167.1+26.4
java_version=25
