# dte:A4
# Test-lite (specs/quality.md, "Test suites"). Every push and pull request: build every mod and run its core server
# game tests, and check and load every datapack (fast, under a minute). Release tags (<project>/v*) and manual runs
# (workflow_dispatch) run the full milestone suite: every server game test (-PmilestoneTests), every client game test
# and the test world screenshot tour on a virtual display.
name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Set on tags and manual runs; empty otherwise.
  MILESTONE: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '-PmilestoneTests' || '' }}

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  # Only pull requests cancel a superseded run; every push to a branch gets a real result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  mods:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: 16x/32x texture pairs (B16)
        run: python3 tools/texcheck.py
      - run: ./gradlew build $MILESTONE --stacktrace
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/run/gameTest/logs/
            **/build/run/gameTest/crash-reports/
      - uses: actions/upload-artifact@v7
        with:
          name: jars
          path: mods/*/build/libs/*.jar

  # Milestone only: release tags and manual runs.
  client-gametests:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # --no-parallel: one game client at a time. Clients started together crashed the JVM (SIGBUS while
      # loading native libraries) on GitHub runners.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1
      - run: xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" ./gradlew runClientGameTest -PmilestoneTests --no-parallel --stacktrace
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: client-gametest-screenshots
          path: mods/*/build/run/clientGameTest/screenshots/

  datapacks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - run: python3 tools/pack.py check
      - run: python3 tools/packload.py
      # PackTest (misode's datapack test mod; owner approved running it 2026-11-14).
      - run: python3 tools/packtest.py
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packtest-log
          path: build/pack*/latest.log

  # Release tag of a pack project (<name>/v<version>, <name> a folder in datapacks/ or resourcepacks/ and not a mod):
  # GitHub Release with its zip(s) (specs/releasing.md; Modrinth only once it meets B14). The tag's version must match
  # the pack's VERSION file.
  pack-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mods, client-gametests, datapacks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build and publish the pack
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          name="${TAG%%/v*}"; ver="${TAG#*/v}"
          if [ -d "mods/$name" ] || { [ ! -d "datapacks/$name" ] && [ ! -d "resourcepacks/$name" ]; }; then
            echo "$TAG is not a pack project; nothing to publish here."; exit 0
          fi
          zips=()
          for kind in datapacks resourcepacks; do
            [ -f "$kind/$name/pack.mcmeta" ] || continue
            have="$(cat "$kind/$name/VERSION" 2>/dev/null || echo 0.1.0)"
            [ "$have" = "$ver" ] || { echo "$kind/$name/VERSION is $have, tag says $ver"; exit 1; }
            zips+=("build/packs/$kind/$name-$ver.zip")
          done
          python3 tools/pack.py build "$name"
          gh release create "$TAG" "${zips[@]}" --title "$name $ver" --notes "See the project's README and CREDITS.md."

  # Release tag of a mod (<mod>/v<version>, <mod> a folder in mods/): the jar goes to a GitHub Release, and to Modrinth
  # when the mod's gradle.properties names its modrinth_project (set only once the owner clears it, B14) and the
  # MODRINTH_TOKEN secret exists. The tag's version must match the mod's mod_version.
  mod-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mods, client-gametests, datapacks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="${TAG%%/v*}"; ver="${TAG#*/v}"
          if [ ! -f "mods/$name/build.gradle" ]; then echo "$TAG is not a mod; nothing to publish here."; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          have="$(sed -n 's/^mod_version=//p' "mods/$name/gradle.properties")"
          [ "$have" = "$ver" ] || { echo "mods/$name mod_version is $have, tag says $ver"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "modrinth=$(sed -n 's/^modrinth_project=//p' "mods/$name/gradle.properties")" >> "$GITHUB_OUTPUT"
      - name: Build the jar
        if: ${{ !steps.tag.outputs.skip }}
        run: ./gradlew :${{ steps.tag.outputs.name }}:jar --stacktrace
      - name: GitHub Release
        if: ${{ !steps.tag.outputs.skip }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          name="${{ steps.tag.outputs.name }}"
          notes="mods/$name/CHANGELOG.md"; [ -f "$notes" ] || notes=/dev/null
          gh release create "$TAG" $(ls mods/$name/build/libs/$name-*.jar | grep -v -- -sources) --title "$name ${TAG#*/v}" --notes-file "$notes"
      - name: Modrinth
        if: ${{ !steps.tag.outputs.skip && steps.tag.outputs.modrinth != '' && env.MODRINTH_TOKEN != '' }}
        run: ./gradlew :${{ steps.tag.outputs.name }}:modrinth --no-configuration-cache --stacktrace
