# dte:A4
# Build every mod and run its server game tests; run client game tests on a virtual display;
# load every datapack on a real headless server. Runs on every push and pull request.
name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mods:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: 16x/32x texture pairs (B16)
        run: python3 tools/texcheck.py
      - run: ./gradlew build --stacktrace
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/run/gameTest/logs/
            **/build/run/gameTest/crash-reports/
      - uses: actions/upload-artifact@v7
        with:
          name: jars
          path: mods/*/build/libs/*.jar

  client-gametests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1
      - run: xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" ./gradlew runClientGameTest --stacktrace
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: client-gametest-screenshots
          path: mods/*/build/run/clientGameTest/screenshots/

  datapacks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - run: python3 tools/pack.py check
      - run: python3 tools/packload.py
      # PackTest (misode's datapack test mod) downloads and runs third-party jars from Modrinth.
      # Off until the owner OKs running it; enable by uncommenting.
      # - run: python3 tools/packtest.py
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packtest-log
          path: build/pack*/latest.log
