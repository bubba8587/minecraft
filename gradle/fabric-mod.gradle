// dte:A2
// Shared build logic for every mod in mods/. Applied from each mod's build.gradle with:
//   apply from: rootProject.file('gradle/fabric-mod.gradle')
// Expects the mod's gradle.properties to set mod_id, mod_version, maven_group.

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.mod_id }

loom {
	splitEnvironmentSourceSets()
	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
	maven { name = 'Bawnorton'; url = 'https://maven.bawnorton.com/releases'; content { includeGroup 'com.github.bawnorton.mixinsquared' } }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def props = [
		version          : project.version,
		mod_id           : project.mod_id,
		minecraft_version: project.minecraft_version,
		loader_version   : project.loader_version,
		java_version     : project.java_version,
	]
	inputs.properties props
	filesMatching('fabric.mod.json') { expand props }
}

java {
	toolchain { languageVersion = JavaLanguageVersion.of(project.java_version as int) }
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.release = project.java_version as int
	options.encoding = 'UTF-8'
}

jar {
	def name = project.mod_id
	inputs.property 'mod_id', name
	from(rootProject.file('LICENSE')) { rename { "${it}_${name}" } }
}

// Game tests (specs/quality.md): src/gametest/ is its own source set with its own fabric.mod.json.
// Server game tests run as part of `build` (core suite; -PmilestoneTests adds the rest); client game tests run with
// `runClientGameTest -PclientTests=<names>` or `-PmilestoneTests`.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "${project.mod_id}-test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true // Agrees to the Minecraft EULA for the dev test server.
	}
}

test {
	useJUnitPlatform()
}

// Test-lite (specs/quality.md, "Test suites"): two server game test suites. Core (the classes under "fabric-gametest" in
// src/gametest/resources/fabric.mod.json, a small smoke set) runs on every build. Milestone (the classes under
// "bubba-milestone-gametest", everything else) is added to "fabric-gametest" only with -PmilestoneTests: release tags,
// manual CI dispatch, or an agent asking for it. Client game tests are milestone too (see runClientGameTest below).
def milestoneTests = providers.gradleProperty('milestoneTests').isPresent()
def suite = milestoneTests ? 'full' : 'core'
// Shared core tests for published mods (gradle/shared-gametest/): added to every published mod's gametest source set and
// core entrypoints. NamesGameTest: every id other mods display has an en_us name (specs/compat.md).
def publishedMod = !(project.findProperty('internal') == 'true')
def sharedCoreTests = publishedMod ? ['io.github.bubba8587.shared.test.NamesGameTest'] : []
if (publishedMod) {
	afterEvaluate { sourceSets.findByName('gametest')?.java?.srcDir(rootProject.file('gradle/shared-gametest/java')) }
}
tasks.matching { it.name == 'processGametestResources' }.configureEach { t ->
	t.inputs.property('milestoneTests', milestoneTests)
	t.inputs.property('sharedCoreTests', sharedCoreTests)
	def outDir = t.destinationDir
	t.doLast {
		def f = new File(outDir, 'fabric.mod.json')
		if (!f.exists() || (!milestoneTests && sharedCoreTests.isEmpty())) return
		def json = new groovy.json.JsonSlurper().parse(f)
		def milestone = milestoneTests ? (json.entrypoints?.get('bubba-milestone-gametest') ?: []) : []
		json.entrypoints['fabric-gametest'] = (json.entrypoints['fabric-gametest'] ?: []) + sharedCoreTests + milestone
		f.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)) + '\n'
	}
}

// Speed: skip server game tests when nothing they run on has changed since the last passing run of that suite. Loom
// declares the run folder (which the game writes logs into) as an input, so Gradle never treats the task as up to date
// on its own; instead we fingerprint the mod's compiled code and resources (main, client, gametest, which also hold
// bundled packs) and skip when it matches the fingerprint a passing run recorded. The marker also records the suite:
// a full pass covers core, a core pass never counts for the full suite. The generated gametest fabric.mod.json differs
// between suites, so the fingerprint uses its source instead. The with* flags (-PwithMobs, -PwithBeacons, ...) put
// other mods on the test runtime, so they are part of the fingerprint too. Force a run with -PrerunGametests.
def gametestSet = sourceSets.findByName('gametest')
def gametestInputs = files(sourceSets.main.output, sourceSets.client.output, gametestSet?.output ?: files())
def gametestFingerprintFiles = files(sourceSets.main.output, sourceSets.client.output,
		gametestSet ? gametestSet.output.asFileTree.matching { exclude 'fabric.mod.json' } : files(),
		file('src/gametest/resources/fabric.mod.json'))
def gametestMarker = layout.buildDirectory.file('gametest/passed.fingerprint')
def forceGametests = providers.gradleProperty('rerunGametests').isPresent()
def withFlags = providers.gradlePropertiesPrefixedBy('with').map { m -> m.findAll { k, v -> k ==~ /with[A-Z].*/ }.collect { k, v -> "${k}=${v}" }.sort().join(',') }
def fingerprintOf = { FileCollection fc ->
	def md = java.security.MessageDigest.getInstance('SHA-256')
	md.update("flags|${withFlags.getOrElse('')}\n".bytes)
	fc.asFileTree.files.sort { it.path }.each { f -> md.update("${f.path}|${f.length()}|${f.lastModified()}\n".bytes) }
	md.digest().encodeHex().toString()
}
tasks.matching { it.name == 'runGameTest' }.configureEach { t ->
	t.inputs.files(gametestInputs).withPropertyName('gametestFingerprintInputs')
	t.inputs.property('gametestSuite', suite)
	t.inputs.property('gametestWithFlags', withFlags)
	t.onlyIf("code or resources changed since the last passing ${suite} game test run") {
		def m = gametestMarker.get().asFile
		if (forceGametests || !m.exists()) return true
		def parts = m.text.trim().tokenize(' ')
		if (parts[0] != fingerprintOf(gametestFingerprintFiles)) return true
		return suite == 'full' && (parts.size() < 2 || parts[1] != 'full')
	}
	// Disk: the server game tests place every run's test areas at a new random spot in the same world, which is never
	// reset, so it grew by tens of MB a run (293 MB seen). Start each run from a fresh world.
	def gametestWorld = file('build/run/gameTest/world')
	t.doFirst { gametestWorld.deleteDir() }
	// Speed: -PgametestFilter=<selector> runs only the matching tests (vanilla's selector, wildcards allowed, e.g.
	// "bubbas_reworked_mobs-test:grab_loot_game_test_*"), for chasing one test. A filtered pass is no full pass, so it
	// records no marker.
	def gametestFilter = providers.gradleProperty('gametestFilter')
	if (gametestFilter.isPresent()) t.systemProperty('fabric-api.gametest.filter', gametestFilter.get())
	t.doLast {
		if (gametestFilter.isPresent()) return
		def m = gametestMarker.get().asFile
		m.parentFile.mkdirs()
		m.text = fingerprintOf(gametestFingerprintFiles) + ' ' + suite + '\n'
	}
}

// Speed: run only some client game tests with -PclientTests=name1,name2 (each test checks the names it answers to;
// see the mod's ClientTests helper). Client game tests are milestone tests (test-lite): without -PclientTests or
// -PmilestoneTests the task is skipped; with -PmilestoneTests and no filter every client test runs, as CI does on tags.
def clientTestsFilter = providers.gradleProperty('clientTests')
def clientTestsAllowed = clientTestsFilter.isPresent() || milestoneTests
tasks.matching { it.name == 'runClientGameTest' }.configureEach { t ->
	t.onlyIf('client game tests are milestone tests: pass -PclientTests=<names> for the parts you changed, or -PmilestoneTests') {
		if (!clientTestsAllowed) println "${t.path} skipped: client game tests are milestone tests (pass -PclientTests=<names> or -PmilestoneTests)"
		clientTestsAllowed
	}
	// Disk: client tests create a new world per run in saves/; start from none.
	def clientSaves = file('build/run/clientGameTest/saves')
	t.doFirst { clientSaves.deleteDir() }
	if (clientTestsFilter.isPresent()) {
		t.jvmArgs("-Dbubba.clientTests=${clientTestsFilter.get()}")
	}
}
