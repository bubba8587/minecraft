// dte:A2
// Shared build logic for every mod in mods/. Applied from each mod's build.gradle with:
//   apply from: rootProject.file('gradle/fabric-mod.gradle')
// Expects the mod's gradle.properties to set mod_id, mod_version, maven_group.

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.mod_id }

loom {
	splitEnvironmentSourceSets()
	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
	maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/' }
	maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
	maven { name = 'isXander'; url = 'https://maven.isxander.dev/releases' }
	maven { name = 'Ladysnake'; url = 'https://maven.ladysnake.org/releases' }
	maven { name = 'Nucleoid'; url = 'https://maven.nucleoid.xyz/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def props = [
		version          : project.version,
		mod_id           : project.mod_id,
		minecraft_version: project.minecraft_version,
		loader_version   : project.loader_version,
		java_version     : project.java_version,
	]
	inputs.properties props
	filesMatching('fabric.mod.json') { expand props }
}

java {
	toolchain { languageVersion = JavaLanguageVersion.of(project.java_version as int) }
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.release = project.java_version as int
	options.encoding = 'UTF-8'
}

jar {
	def name = project.mod_id
	inputs.property 'mod_id', name
	from(rootProject.file('LICENSE')) { rename { "${it}_${name}" } }
}

// Game tests (specs/quality.md): src/gametest/ is its own source set with its own fabric.mod.json.
// Server game tests run as part of `build`; client game tests run with `runClientGameTest`.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "${project.mod_id}-test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true // Agrees to the Minecraft EULA for the dev test server.
	}
}

test {
	useJUnitPlatform()
}

// Speed: skip server game tests when nothing they run on has changed since the last passing run. Loom declares
// the run folder (which the game writes logs into) as an input, so Gradle never treats the task as up to date on its
// own; instead we fingerprint the mod's compiled code and resources (main, client, gametest, which also hold bundled
// packs) and skip when it matches the fingerprint a passing run recorded. Force a run with -PrerunGametests.
def gametestInputs = files(sourceSets.main.output, sourceSets.client.output,
		sourceSets.findByName('gametest')?.output ?: files())
def gametestMarker = layout.buildDirectory.file('gametest/passed.fingerprint')
def forceGametests = providers.gradleProperty('rerunGametests').isPresent()
def fingerprintOf = { FileCollection fc ->
	def md = java.security.MessageDigest.getInstance('SHA-256')
	fc.asFileTree.files.sort { it.path }.each { f -> md.update("${f.path}|${f.length()}|${f.lastModified()}\n".bytes) }
	md.digest().encodeHex().toString()
}
tasks.matching { it.name == 'runGameTest' }.configureEach { t ->
	t.inputs.files(gametestInputs).withPropertyName('gametestFingerprintInputs')
	t.onlyIf('code or resources changed since the last passing game test run') {
		def m = gametestMarker.get().asFile
		forceGametests || !m.exists() || m.text.trim() != fingerprintOf(gametestInputs)
	}
	// Disk: the server game tests place every run's test areas at a new random spot in the same world, which is never
	// reset, so it grew by tens of MB a run (293 MB seen). Start each run from a fresh world.
	def gametestWorld = file('build/run/gameTest/world')
	t.doFirst { gametestWorld.deleteDir() }
	t.doLast {
		def m = gametestMarker.get().asFile
		m.parentFile.mkdirs()
		m.text = fingerprintOf(gametestInputs) + '\n'
	}
}

// Speed: run only some client game tests with -PclientTests=name1,name2 (each test checks the names it answers to;
// see the mod's ClientTests helper). Without the property every client test runs, as CI does.
def clientTestsFilter = providers.gradleProperty('clientTests')
tasks.matching { it.name == 'runClientGameTest' }.configureEach { t ->
	// Disk: client tests create a new world per run in saves/; start from none.
	def clientSaves = file('build/run/clientGameTest/saves')
	t.doFirst { clientSaves.deleteDir() }
	if (clientTestsFilter.isPresent()) {
		t.jvmArgs("-Dbubba.clientTests=${clientTestsFilter.get()}")
	}
}
